version: '3.8'

services:
  localstack-s3:
    image: localstack/localstack:3.4.0
    container_name: localstack-s3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3

  localstack-sqs:
    image: localstack/localstack:3.4.0
    container_name: localstack-sqs
    ports:
      - "4567:4566"
    environment:
      - SERVICES=sqs

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=dataclean_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
